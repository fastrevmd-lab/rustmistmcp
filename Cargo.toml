[workspace]
members = ["crates/rustmistmcp-core", "crates/rustmistmcp"]
default-members = ["crates/rustmistmcp-core", "crates/rustmistmcp"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/fastrevmd-lab/rustmistmcp"
authors = ["fastrevmd-lab"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hex = "0.4"
http = "1"
jsonschema = { version = "0.37.4", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "rustls-no-provider"] }
rmcp = { version = "2", features = ["server", "transport-io", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
zeroize = "1"

# mecmcp#90 and mecmcp#91 remain open prerequisites. This consumer records the
# constraint and must not replace their missing generic APIs locally.
# Every shared crate is pinned to one immutable revision so extension TypeIds
# cannot diverge across the server process.
mecmcp-audit = { version = "0.3.8", git = "https://github.com/fastrevmd-lab/mecmcp", rev = "75a1e9db10a21a85876f337313ba47bc0329d74d" }
mecmcp-auth = { version = "0.3.8", git = "https://github.com/fastrevmd-lab/mecmcp", rev = "75a1e9db10a21a85876f337313ba47bc0329d74d" }
mecmcp-changeset = { version = "0.3.8", git = "https://github.com/fastrevmd-lab/mecmcp", rev = "75a1e9db10a21a85876f337313ba47bc0329d74d" }
mecmcp-inventory = { version = "0.3.8", git = "https://github.com/fastrevmd-lab/mecmcp", rev = "75a1e9db10a21a85876f337313ba47bc0329d74d" }
mecmcp-runtime = { version = "0.3.8", git = "https://github.com/fastrevmd-lab/mecmcp", rev = "75a1e9db10a21a85876f337313ba47bc0329d74d" }
mecmcp-server = { version = "0.3.8", git = "https://github.com/fastrevmd-lab/mecmcp", rev = "75a1e9db10a21a85876f337313ba47bc0329d74d" }
mecmcp-transport = { version = "0.3.8", git = "https://github.com/fastrevmd-lab/mecmcp", rev = "75a1e9db10a21a85876f337313ba47bc0329d74d" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
