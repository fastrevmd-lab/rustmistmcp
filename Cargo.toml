[workspace]
members = ["crates/rustmistmcp-core", "crates/rustmistmcp"]
default-members = ["crates/rustmistmcp-core", "crates/rustmistmcp"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/fastrevmd-lab/rustmistmcp"
authors = ["fastrevmd-lab"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hex = "0.4"
http = "1"
jsonschema = { version = "0.37.4", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "rustls-no-provider"] }
rmcp = { version = "3.1", features = ["server", "transport-io", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
zeroize = "1"

# Every shared crate is pinned to one immutable revision so extension TypeIds
# cannot diverge across the server process. This revision is the v0.8.7 tag.
# mecmcp#91 (target-neutral auth scope vocabulary) is the remaining open
# prerequisite; it is why the shared CLI still spells the profile flag
# `--device-mapping`.
mecmcp-audit = { version = "0.8.8", git = "https://github.com/fastrevmd-lab/mecmcp", rev = "850f52972d33bd4c3e33cf4998fc7e821188707c" }
mecmcp-auth = { version = "0.8.8", git = "https://github.com/fastrevmd-lab/mecmcp", rev = "850f52972d33bd4c3e33cf4998fc7e821188707c" }
mecmcp-changeset = { version = "0.8.8", git = "https://github.com/fastrevmd-lab/mecmcp", rev = "850f52972d33bd4c3e33cf4998fc7e821188707c" }
mecmcp-http = { version = "0.8.8", git = "https://github.com/fastrevmd-lab/mecmcp", rev = "850f52972d33bd4c3e33cf4998fc7e821188707c" }
mecmcp-inventory = { version = "0.8.8", git = "https://github.com/fastrevmd-lab/mecmcp", rev = "850f52972d33bd4c3e33cf4998fc7e821188707c" }
mecmcp-job = { version = "0.8.8", git = "https://github.com/fastrevmd-lab/mecmcp", rev = "850f52972d33bd4c3e33cf4998fc7e821188707c" }
mecmcp-runtime = { version = "0.8.8", git = "https://github.com/fastrevmd-lab/mecmcp", rev = "850f52972d33bd4c3e33cf4998fc7e821188707c" }
mecmcp-secret = { version = "0.8.8", git = "https://github.com/fastrevmd-lab/mecmcp", rev = "850f52972d33bd4c3e33cf4998fc7e821188707c" }
mecmcp-server = { version = "0.8.8", git = "https://github.com/fastrevmd-lab/mecmcp", rev = "850f52972d33bd4c3e33cf4998fc7e821188707c" }
mecmcp-transport = { version = "0.8.8", git = "https://github.com/fastrevmd-lab/mecmcp", rev = "850f52972d33bd4c3e33cf4998fc7e821188707c" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
