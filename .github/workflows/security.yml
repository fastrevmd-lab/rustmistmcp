name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '31 7 * * 1'

permissions:
  contents: read
  pull-requests: read

jobs:
  # Secret scan: the shared mechubsec workflow (pinned gitleaks binary, no
  # licence needed). PRs and pushes scan their own commits; the weekly
  # schedule scans full history.
  secrets:
    uses: mechubsec/.github/.github/workflows/gitleaks.yml@1f46f69afab3cc1c77efa196747bc3a5e45a3755

  secrets-and-supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cargo audit and deny
        run: |
          cargo install --locked cargo-audit cargo-deny
          cargo audit
          cargo deny check
