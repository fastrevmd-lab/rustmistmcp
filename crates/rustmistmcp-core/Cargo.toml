[package]
name = "rustmistmcp-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
futures.workspace = true
hex.workspace = true
http.workspace = true
jsonschema.workspace = true
reqwest.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true
zeroize.workspace = true
mecmcp-audit.workspace = true
mecmcp-auth.workspace = true
mecmcp-changeset.workspace = true
mecmcp-http.workspace = true
mecmcp-inventory.workspace = true
mecmcp-secret.workspace = true
mecmcp-server.workspace = true

[features]
# Gates HttpMistClient::from_test_parts, which skips endpoint validation and
# HTTPS enforcement. A consumer's integration tests enable this in their own
# [dev-dependencies] entry for this crate; it must never be on for the normal
# dependency.
test-util = []

[dev-dependencies]
axum.workspace = true
rustls.workspace = true
# Self-signed test certificates for the 429-retry and budget-tracking tests
# in src/client.rs, which need a real TLS round trip: mecmcp-http's
# HttpRequest::new() rejects non-https URLs unconditionally, so a plain-HTTP
# mock cannot exercise HttpMistClient::execute_as at all.
rcgen = "0.13"
tempfile = "3"
tokio-rustls = "0.26"
toml = "1.1"
tower.workspace = true

[lints]
workspace = true
